<script>
  // Register SW
  if ("serviceWorker" in navigator) {
    navigator.serviceWorker.register("/sw.js")
      .then((registration) => {
        console.log("Service Worker registered with scope:", registration.scope);
      })
      .catch((error) => {
        console.log("Service Worker registration failed:", error);
      });
  }

  // Enable buttons (JS available)
  console.log("Enabling buttons...");
  const autoplayToggle = document.getElementById("autoplay-toggle");
  const prevBtn = document.getElementById("prev");
  const nextBtn = document.getElementById("next");

  [autoplayToggle, prevBtn, nextBtn].forEach((btn) => {
    btn.classList.remove("disabled");
    btn.disabled = false;
  });

  let autoplay = false;
  const tracks = document.querySelectorAll(".track audio");
  const trackContainers = document.querySelectorAll(".track");
  const saveButtons = document.querySelectorAll(".save-offline");
  const removeButtons = document.querySelectorAll(".remove-offline");
  let currentIndex = 0;

  // ----- OFFLINE SAVE/REMOVE (merged) -----
  // 1) Initialize remove buttons as disabled until we know cache state
  removeButtons.forEach((button) => {
    button.disabled = true;
    button.classList.add("disabled");
  });

  // 2) Check Cache API to set initial state so UI is correct on first paint
  if ("caches" in window) {
    const btns = Array.from(saveButtons);
    const urls = btns.map((btn) => btn.dataset.url);

    urls.forEach((url) => {
      caches.match(url).then((cached) => {
        const saveBtn = document.querySelector(`button.save-offline[data-url="${url}"]`);
        const removeBtn = document.querySelector(`button.remove-offline[data-url="${url}"]`);
        if (!saveBtn || !removeBtn) return;

        if (cached) {
          saveBtn.textContent = "Saved";
          saveBtn.disabled = true;
          saveBtn.classList.add("disabled");
          removeBtn.disabled = false;
          removeBtn.classList.remove("disabled");
        } else {
          saveBtn.textContent = "Save for offline";
          saveBtn.disabled = false;
          saveBtn.classList.remove("disabled");
          removeBtn.disabled = true;
          removeBtn.classList.add("disabled");
        }
      });
    });
  }

  // 3) Helper to talk to SW
  function sendToServiceWorker(action, url) {
    navigator.serviceWorker.ready.then((registration) => {
      if (registration.active) {
        registration.active.postMessage({ action, url });
        console.log(`Sent ${action} request for ${url}`);
      }
    });
  }

  // 4) Wire up clicks
  saveButtons.forEach((button) => {
    button.addEventListener("click", () => {
      sendToServiceWorker("save", button.dataset.url);
    });
  });

  removeButtons.forEach((button) => {
    button.addEventListener("click", () => {
      sendToServiceWorker("remove", button.dataset.url);
    });
  });

  // 5) React to SW messages to keep UI synced
  navigator.serviceWorker.addEventListener("message", (event) => {
    const { status, url } = event.data || {};
    if (!status || !url) return;

    const saveBtn = document.querySelector(`button.save-offline[data-url="${url}"]`);
    const removeBtn = document.querySelector(`button.remove-offline[data-url="${url}"]`);
    if (!saveBtn || !removeBtn) return;

    if (status === "saved") {
      saveBtn.textContent = "Saved";
      saveBtn.disabled = true;
      saveBtn.classList.add("disabled");
      removeBtn.disabled = false;
      removeBtn.classList.remove("disabled");
    } else if (status === "removed") {
      saveBtn.textContent = "Save for offline";
      saveBtn.disabled = false;
      saveBtn.classList.remove("disabled");
      removeBtn.disabled = true;
      removeBtn.classList.add("disabled");
    }
  });
  // ----- END OFFLINE SAVE/REMOVE -----

  // Autoplay toggle
  autoplayToggle.addEventListener("click", () => {
    autoplay = !autoplay;
    console.log(`Autoplay set to: ${autoplay}`);
    autoplayToggle.textContent = `Autoplay: ${autoplay ? "On" : "Off"}`;
  });

  // Play specific track and update highlight
  function playTrack(index) {
    console.log(`Request to play track at index: ${index}`);
    if (index < 0) index = tracks.length - 1;
    else if (index >= tracks.length) index = 0;

    tracks.forEach((track) => {
      if (!track.paused) track.pause();
    });

    trackContainers[currentIndex].classList.remove("active");
    tracks[index].play().catch((err) => {
      console.log("Playback failed (likely due to autoplay policy):", err);
    });
    trackContainers[index].classList.add("active");
    currentIndex = index;
    console.log(`Current track index set to: ${currentIndex}`);
  }

  // Prev / Next
  prevBtn.addEventListener("click", () => playTrack(currentIndex - 1));
  nextBtn.addEventListener("click", () => playTrack(currentIndex + 1));

  // Keep highlight and chain autoplay
  tracks.forEach((track, index) => {
    track.addEventListener("play", function () {
      tracks.forEach((t) => {
        if (t !== this && !t.paused) t.pause();
      });
      trackContainers.forEach((t) => t.classList.remove("active"));
      trackContainers[index].classList.add("active");
      currentIndex = index;
    });

    track.addEventListener("ended", () => {
      if (autoplay) playTrack(index + 1);
    });
  });
</script>
